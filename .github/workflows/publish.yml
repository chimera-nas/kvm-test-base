name: Build and publish KVM test images

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs packages:write to push OCI artifacts to GHCR.
permissions:
  contents: read
  packages: write

env:
  # Base name for the published OCI artifacts; one package per variant:
  #   ghcr.io/chimera-nas/kvm-test-base/<variant>:<version>-<arch>
  REGISTRY_BASE: ghcr.io/${{ github.repository }}
  ARTIFACT_TYPE: application/vnd.chimera.kvm-image.v1

jobs:
  publish:
    # amd64 on the standard hosted runner, arm64 on the hosted arm64 runner.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        variant:
          - { name: ubuntu2404,     ubuntu: "24.04", codename: noble,    kernel: linux-image-generic }
          - { name: ubuntu2404_hwe, ubuntu: "24.04", codename: noble,    kernel: linux-image-generic-hwe-24.04 }
          - { name: ubuntu2204_hwe, ubuntu: "22.04", codename: jammy,    kernel: linux-image-generic-hwe-22.04 }
          - { name: ubuntu2604,     ubuntu: "26.04", codename: resolute, kernel: linux-image-generic }

    name: ${{ matrix.variant.name }} (${{ matrix.arch }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up ORAS
        uses: oras-project/setup-oras@v1

      - name: Resolve version and target
        id: meta
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ -z "${VERSION}" ]; then
            echo "::error::VERSION file is empty"; exit 1
          fi
          # Single 2-segment repo (ghcr.io/<owner>/kvm-test-base); the variant
          # is encoded in the tag so registry proxies that can't route nested
          # (3+ segment) repository paths still work.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY_BASE}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.variant.name }}-${VERSION}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Immutability guard: never overwrite an already-published version.
      # Bumping the VERSION file is what creates a new artifact; existing
      # versions are left untouched.
      - name: Check if this version is already published
        id: check
        run: |
          REF="${{ steps.meta.outputs.ref }}:${{ steps.meta.outputs.tag }}"
          if oras manifest fetch "${REF}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${REF} already published; bump the VERSION file to publish changes. Skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools (qemu-img, mkfs.ext4)
        if: steps.check.outputs.exists != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils e2fsprogs

      - name: Build VM image (kernel + initrd + rootfs.qcow2)
        if: steps.check.outputs.exists != 'true'
        run: |
          mkdir -p out
          # No KVM_CACHE_REGISTRY here -> plain `docker build` with default
          # registries/mirrors (works on hosted runners and external forks).
          bash build_vm_image.sh "$PWD/out" "$PWD/Dockerfile.kvm" "$PWD" \
            UBUNTU_VERSION=${{ matrix.variant.ubuntu }} \
            UBUNTU_VERSION_CODENAME=${{ matrix.variant.codename }} \
            KERNEL_PACKAGE=${{ matrix.variant.kernel }}

      - name: Push OCI artifact
        if: steps.check.outputs.exists != 'true'
        working-directory: out
        run: |
          REF="${{ steps.meta.outputs.ref }}"
          FILES="vmlinuz:application/octet-stream \
                 initrd:application/octet-stream \
                 rootfs.qcow2:application/octet-stream"
          # Immutable, version-pinned tag (the durable artifact).
          oras push "${REF}:${{ steps.meta.outputs.tag }}" \
            --artifact-type "${ARTIFACT_TYPE}" ${FILES}
          # Moving convenience tag, updated only when a new version publishes.
          oras tag "${REF}:${{ steps.meta.outputs.tag }}" "${{ matrix.variant.name }}-latest-${{ matrix.arch }}"
